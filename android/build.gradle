buildscript {
    ext.kotlin_version = '1.8.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("com.google.gms:google-services:4.4.0")
    }
}

// تعريف إعدادات SDK المشتركة للموديولات الفرعية
ext {
    compileSdkVersion = 35
    targetSdkVersion = 35
    minSdkVersion = 23
}

// Provide a `flutter` map expected by some older plugins (e.g. record_android)
ext.flutter = [
    compileSdkVersion: 35,
    targetSdkVersion: 35,
    minSdkVersion: 23,
    // flutter.versionCode / versionName may be filled from local.properties at runtime
]

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// بعض موديولات قد تعتمد على أن :app مُقيّم أولاً
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
